<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui}[hidden]{display:none!important}</style>
<script src="config.js"></script></head>
<body>
<title>垃圾分類大挑戰</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bpmf+Huninn&display=swap">
<style>
/* Layout: tablet = status bar, one play area, big answer buttons; teacher board (#board) = settings strip + ranked score bars.
   Palette follows the lesson deck: soft grey-green ground, leaf green, sky blue, amber. */
:root {
  --bg: #ecece8;
  --surface: #fbfbf8;
  --ink: #23302a;
  --ink2: #4a5a50;
  --line: #d3d6cd;
  --accent: #4f7a14;
  --on-accent: #ffffff;
  --good: #2b7a38;
  --bad: #b3362a;
  --stage: #ffffff;
  --focus: #2b6fc4;
  --bin-recycle: #2b6fc4;
  --bin-food: #b45f06;
  --bin-trash: #5b6470;
  --font-body: 'Bpmf Huninn', 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131b16; --surface: #1e2922; --ink: #eef2ec; --ink2: #b7c4ba; --line: #33423a;
    --accent: #a8c85a; --on-accent: #10200a; --good: #6fcf7f; --bad: #ff8a78; --stage: #f3f1ea; --focus: #8db8ff;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131b16; --surface: #1e2922; --ink: #eef2ec; --ink2: #b7c4ba; --line: #33423a;
  --accent: #a8c85a; --on-accent: #10200a; --good: #6fcf7f; --bad: #ff8a78; --stage: #f3f1ea; --focus: #8db8ff;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { touch-action: pan-x pan-y; -webkit-tap-highlight-color: transparent; }
button { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 20px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px;
}
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 4px solid var(--focus); outline-offset: 3px; }
.app { display: flex; flex-direction: column; gap: 18px; min-height: calc(100dvh - 32px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); max-width: 1280px; margin: 0 auto; }
main { flex: 1; display: flex; flex-direction: column; gap: 18px; min-width: 0; }

/* top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.chip { color: #fff; border-radius: 999px; padding: 6px 22px; font-size: 26px; white-space: nowrap; }
.score { background: var(--surface); border: 2px solid var(--line); border-radius: 999px; padding: 6px 22px; font-size: 24px; }
.score b { font-size: 34px; font-weight: 400; color: var(--accent); }
.gamepill { background: var(--surface); border: 2px solid var(--line); border-radius: 999px; padding: 6px 18px; font-size: 22px; }
.grow { flex: 1; }
.status { font-size: 18px; color: var(--ink2); }
.btn-sm { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 6px 16px; font-size: 18px; min-height: 44px; }
.btn-big { background: var(--accent); color: var(--on-accent); border: none; border-radius: 22px; padding: 14px 40px; font-size: 34px; min-height: 72px; }
.btn-ghost { background: transparent; color: var(--ink); border: 3px solid var(--line); border-radius: 22px; padding: 12px 28px; font-size: 26px; min-height: 64px; }
.coopbar { display: flex; align-items: center; gap: 14px; background: var(--surface); border: 2px solid var(--line); border-radius: 18px; padding: 6px 16px; font-size: 20px; }
.track { flex: 1; height: 18px; border-radius: 999px; background: var(--line); overflow: hidden; }
.track i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s ease; }

/* centered screens */
.center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; text-align: center; padding: 12px 0; }
.center h1 { font-size: clamp(44px, 8vw, 84px); font-weight: 400; line-height: 1.3; }
.center .sub { font-size: clamp(22px, 3vw, 30px); color: var(--ink2); max-width: 28em; }
.pill { background: var(--surface); border: 2px solid var(--line); border-radius: 999px; padding: 4px 22px; font-size: 24px; color: var(--ink2); }

/* setup */
.setup { display: flex; flex-direction: column; gap: 22px; }
.setup h1 { font-size: clamp(36px, 6vw, 60px); font-weight: 400; line-height: 1.3; }
.setup h2 { font-size: 28px; font-weight: 400; }
.groups { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.gbtn { color: #fff; border: 5px solid transparent; border-radius: 20px; min-height: 78px; font-size: 30px; }
.gbtn[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 4px var(--bg), 0 0 0 8px var(--ink); }
.stepper { display: flex; align-items: center; gap: 16px; }
.stepper button { width: 64px; height: 64px; border-radius: 18px; border: 3px solid var(--line); background: var(--surface); font-size: 34px; }
.stepper output { font-size: 44px; min-width: 64px; text-align: center; }
.names { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.names input { font: inherit; font-size: 24px; padding: 10px 14px; border-radius: 14px; border: 3px solid var(--line); background: var(--surface); color: var(--ink); min-width: 0; width: 100%; }
.row { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
.note { font-size: 18px; color: var(--ink2); max-width: 60ch; }
a.link { color: var(--accent); font-size: 20px; }
.seg { border: 3px solid var(--line); background: var(--surface); border-radius: 14px; padding: 6px 16px; font-size: 22px; min-height: 52px; }
.seg[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

/* play: shared */
.hint { text-align: center; font-size: clamp(26px, 4vw, 38px); }
.hint small { display: block; font-size: 20px; color: var(--ink2); }
.stage { flex: 1; display: grid; place-items: center; min-height: 0; }
.itemcard { background: var(--stage); color: #23302a; border-radius: 32px; padding: 18px 40px 22px; display: flex; flex-direction: column; align-items: center; gap: 4px; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; box-shadow: 0 10px 0 rgba(0,0,0,.12); transition: transform .2s ease; }
.itemcard.drag { cursor: grabbing; transition: none; box-shadow: 0 22px 30px rgba(0,0,0,.28); z-index: 5; position: relative; }
.itemcard.still { cursor: default; touch-action: auto; }
.itemcard svg { width: clamp(150px, 28vh, 270px); height: clamp(150px, 28vh, 270px); pointer-events: none; }
.itemcard .nm { font-size: clamp(30px, 5vw, 50px); text-align: center; pointer-events: none; }
.bins { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.bin { border: 6px solid transparent; border-radius: 26px; color: #fff; min-height: clamp(120px, 21vh, 190px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: clamp(26px, 3.6vw, 42px); padding: 10px 8px; min-width: 0; overflow-wrap: anywhere; }
.ic { width: clamp(52px, 9vh, 84px); height: clamp(52px, 9vh, 84px); background: #fff; border-radius: 50%; display: grid; place-items: center; flex: none; }
.ic svg { width: 78%; height: 78%; }
.bin.hot { border-color: #fff; box-shadow: 0 0 0 6px var(--ink); transform: scale(1.03); }
.bin:disabled { cursor: default; opacity: .55; }
.bin.right { opacity: 1; border-color: #fff; box-shadow: 0 0 0 6px var(--good); }
.b-recycle { background: var(--bin-recycle); } .b-food { background: var(--bin-food); } .b-trash { background: var(--bin-trash); }
.tag { color: #fff; border-radius: 14px; padding: 2px 16px; white-space: nowrap; }

/* belt */
.timebar { height: 16px; border-radius: 999px; background: var(--line); overflow: hidden; }
.timebar i { display: block; height: 100%; background: var(--accent); width: 100%; }
.lane { position: relative; height: clamp(180px, 27vh, 230px); background: var(--surface); border: 3px solid var(--line); border-radius: 26px; }
.lane::before { content: ""; position: absolute; left: 14px; right: 14px; bottom: 12px; height: 10px; border-radius: 6px; background: repeating-linear-gradient(90deg, var(--line) 0 22px, transparent 22px 40px); }
.bitem { position: absolute; left: 0; top: 10px; display: flex; flex-direction: column; align-items: center; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; min-width: 130px; padding: 6px 12px 4px; background: var(--stage); color: #23302a; border-radius: 20px; box-shadow: 0 6px 0 rgba(0,0,0,.14); }
.bitem svg { width: 104px; height: 104px; pointer-events: none; }
.bitem span { font-size: 22px; white-space: nowrap; pointer-events: none; }
.bitem.drag { z-index: 10; cursor: grabbing; box-shadow: 0 18px 26px rgba(0,0,0,.3); }
.toast { min-height: 48px; text-align: center; font-size: clamp(22px, 3vw, 30px); }
.toast.ok { color: var(--good); } .toast.no { color: var(--bad); }

/* find the mistakes */
.fgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.fcol { background: var(--surface); border: 3px solid var(--line); border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; }
.fhead { color: #fff; display: flex; align-items: center; gap: 10px; justify-content: center; padding: 8px; font-size: clamp(22px, 3vw, 32px); }
.fhead .ic { width: 44px; height: 44px; }
.ftiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; padding: 12px; }
.ftile { background: var(--stage); color: #23302a; border: 4px solid transparent; border-radius: 18px; padding: 6px 4px; display: flex; flex-direction: column; align-items: center; font-size: 20px; min-height: 140px; line-height: 1.4; }
.ftile svg { width: 84px; height: 84px; pointer-events: none; }
.ftile.ok { border-color: var(--good); }
.ftile .okb { color: #fff; background: var(--good); border-radius: 10px; padding: 0 10px; font-size: 16px; }
.ftile.shake { animation: shake .4s; }
@keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.msg { min-height: 60px; text-align: center; font-size: clamp(20px, 2.6vw, 28px); }
.msg.ok { color: var(--good); } .msg.no { color: var(--bad); }
.lives { display: inline-flex; gap: 6px; vertical-align: middle; }
.lives i { width: 18px; height: 18px; border-radius: 50%; background: var(--bad); display: inline-block; }
.lives i.off { background: transparent; border: 3px solid var(--line); }

/* true / false and 4R */
.stmt { font-size: clamp(28px, 4.4vw, 48px); text-align: center; display: flex; gap: 12px; align-items: center; justify-content: center; flex-wrap: wrap; }
.tfrow { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.tfbtn { border: none; border-radius: 26px; color: #fff; min-height: clamp(110px, 18vh, 160px); font-size: clamp(34px, 5vw, 54px); display: flex; align-items: center; justify-content: center; gap: 16px; }
.tfbtn svg { width: 64px; height: 64px; }
.tfbtn.yes { background: #2b7a38; } .tfbtn.no { background: #b3362a; }
.opts4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.rbtn { border: none; border-radius: 24px; color: #fff; min-height: clamp(120px, 20vh, 180px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; font-size: clamp(26px, 3.6vw, 40px); padding: 8px; }
.scen { background: var(--stage); color: #23302a; border-radius: 28px; padding: 26px 34px; font-size: clamp(30px, 4.6vw, 52px); line-height: 1.5; text-align: center; max-width: 900px; box-shadow: 0 10px 0 rgba(0,0,0,.12); }

@media (max-width: 560px) {
  .bins { grid-template-columns: 1fr; }
  .bin { flex-direction: row; min-height: 84px; justify-content: flex-start; padding-left: 20px; gap: 16px; }
  .groups { grid-template-columns: repeat(2, 1fr); }
  .fgrid { grid-template-columns: 1fr; }
  .opts4 { grid-template-columns: repeat(2, 1fr); }
  .beltmode .bins { grid-template-columns: repeat(3, 1fr); }
  .beltmode .bin { flex-direction: column; justify-content: center; padding: 8px 2px; font-size: 20px; min-height: 100px; gap: 4px; }
  .beltmode .bitem svg { width: 80px; height: 80px; }
}

/* feedback + summary */
.result { background: var(--surface); border: 4px solid var(--line); border-radius: 32px; padding: 22px 30px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; max-width: 860px; width: 100%; }
.result.ok { border-color: var(--good); } .result.no { border-color: var(--bad); }
.result .head { display: flex; align-items: center; gap: 16px; font-size: clamp(34px, 6vw, 60px); line-height: 1.3; }
.result.ok .head { color: var(--good); } .result.no .head { color: var(--bad); }
.result .head svg { width: 68px; height: 68px; flex: none; }
.result .what { display: flex; align-items: center; gap: 16px; font-size: clamp(24px, 3.4vw, 34px); flex-wrap: wrap; justify-content: center; }
.mini { width: 92px; height: 92px; background: var(--stage); border-radius: 20px; padding: 6px; flex: none; display: grid; place-items: center; }
.mini svg { width: 100%; height: 100%; }
.result .why { font-size: clamp(22px, 3vw, 30px); max-width: 30em; }
.result .q { font-size: 24px; color: var(--ink2); }
.sumlist { display: flex; flex-direction: column; gap: 8px; width: 100%; text-align: left; }
.sumrow { display: grid; grid-template-columns: 70px 1fr; gap: 14px; align-items: center; font-size: 24px; line-height: 1.4; }
.sumrow .mini { width: 70px; height: 70px; border-radius: 16px; padding: 4px; }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 30; }
.confetti i { position: absolute; top: -24px; width: 14px; height: 20px; border-radius: 3px; animation: fall 1.7s ease-in forwards; }
@keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--r)); } }
@media (prefers-reduced-motion: reduce) { .confetti { display: none; } .itemcard { transition: none; } .ftile.shake { animation: none; } .track i { transition: none; } }

/* round summary */
.plist { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 760px; }
.prow { display: grid; grid-template-columns: minmax(120px, 220px) 1fr 70px; gap: 14px; align-items: center; font-size: 26px; text-align: left; }
.prow .bar { background: var(--line); border-radius: 999px; height: 26px; overflow: hidden; }
.prow .bar i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.prow .pt { text-align: right; font-size: 30px; }

/* board */
.board-head { display: flex; flex-wrap: wrap; gap: 16px; align-items: end; justify-content: space-between; }
.board-head h1 { font-size: clamp(34px, 5vw, 54px); font-weight: 400; line-height: 1.3; }
.total { background: var(--surface); border: 3px solid var(--line); border-radius: 26px; padding: 8px 30px; text-align: center; }
.total span { display: block; font-size: 22px; color: var(--ink2); }
.total b { font-size: clamp(52px, 8vw, 88px); font-weight: 400; color: var(--accent); line-height: 1.1; font-variant-numeric: tabular-nums; }
.grid2 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 24px; align-items: start; }
@media (max-width: 900px) { .grid2 { grid-template-columns: 1fr; } }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: 26px; padding: 22px 26px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card h2 { font-size: 30px; font-weight: 400; }
.ctl { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
.ctl > span.lab { font-size: 22px; color: var(--ink2); }
.ctl .goal { display: inline-flex; align-items: center; gap: 8px; font-size: 26px; }
.energy .track { height: 44px; }
.energy .big { font-size: clamp(30px, 5vw, 52px); line-height: 1.3; }
.energy .win { color: var(--good); font-size: 30px; }
.grow-row { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 6px 16px; align-items: center; }
.grow-row .pts { min-width: 70px; }
.adjcell { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
.adjcell .btn-sm { min-width: 52px; font-size: 26px; padding: 2px 12px; }
@media (max-width: 560px) { .grow-row { grid-template-columns: 110px minmax(0, 1fr) auto; gap: 6px 10px; } }
.grow-row .chip { font-size: 24px; text-align: center; padding: 4px 10px; }
.grow-row .bar { background: var(--line); border-radius: 14px; height: 44px; overflow: hidden; }
.grow-row .bar i { display: block; height: 100%; border-radius: 14px; transition: width .5s ease; min-width: 10px; }
.grow-row .pts { text-align: right; font-size: 40px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.grow-row .meta { grid-column: 2 / 4; font-size: 17px; color: var(--ink2); margin-top: -2px; }
.miss { display: grid; grid-template-columns: 76px 1fr; gap: 14px; align-items: center; }
.miss .mini { width: 76px; height: 76px; border-radius: 16px; padding: 5px; }
.miss p { font-size: 22px; line-height: 1.4; }
.miss small { color: var(--ink2); font-size: 17px; }
.empty { color: var(--ink2); font-size: 22px; padding: 10px 0; }
.confirm { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
</style>

<div class="app" id="app"></div>

<script>
(function () {
  'use strict';
  // no zoom from double-tap or pinch on tablets (iOS Safari ignores user-scalable)
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (ev) { document.addEventListener(ev, function (e) { e.preventDefault(); }); });
  var K = '#1b1b1b';
  var SW = 'stroke="' + K + '" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"';
  function arrows(col, w) {
    return [0, 120, 240].map(function (r) {
      return '<g transform="rotate(' + r + ')"><path d="M0 -34A34 34 0 0 1 33.5 5.9" fill="none" stroke="' + col + '" stroke-width="' + w + '" stroke-linecap="round"/><polygon points="44.3,7.8 22.7,4 31.1,19.6" fill="' + col + '"/></g>';
    }).join('');
  }

  /* ---------- bins ---------- */
  var BINS = {
    recycle: { name: '資源回收', cls: 'b-recycle', color: '#2b6fc4',
      icon: '<svg viewBox="-50 -50 100 100" aria-hidden="true"><g transform="scale(1.1)">' + arrows('#2b6fc4', 10) + '</g></svg>' },
    food: { name: '廚餘', cls: 'b-food', color: '#b45f06',
      icon: '<svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 32C40 22 16 26 18 54C20 74 38 90 50 84C62 90 80 74 82 54C84 26 60 22 50 32Z" fill="#b45f06"/><path d="M50 32C50 22 56 15 66 12" stroke="#2b7a38" stroke-width="7" fill="none" stroke-linecap="round"/></svg>' },
    trash: { name: '一般垃圾', cls: 'b-trash', color: '#5b6470',
      icon: '<svg viewBox="0 0 100 100" aria-hidden="true"><rect x="28" y="38" width="44" height="48" rx="7" fill="#5b6470"/><rect x="22" y="27" width="56" height="11" rx="5" fill="#5b6470"/><rect x="41" y="18" width="18" height="9" rx="4" fill="#5b6470"/><path d="M41 48v30M50 48v30M59 48v30" stroke="#fff" stroke-width="4.5" stroke-linecap="round"/></svg>' }
  };
  var BIN_ORDER = ['recycle', 'food', 'trash'];

  /* ---------- items (drawn on a 200x200 canvas) ---------- */
  var ITEMS = [
    { id: 'pet', name: '寶特瓶', bin: 'recycle', why: '乾淨的寶特瓶可以回收，倒乾淨、壓扁再丟。',
      svg: '<rect x="80" y="12" width="40" height="24" rx="6" fill="#6b7280" ' + SW + '/><path d="M86 36h28v20c0 10 28 16 28 40v72q0 14-14 14H72q-14 0-14-14V96c0-24 28-30 28-40z" fill="#d6ecff" ' + SW + '/><rect x="58" y="104" width="84" height="46" fill="#2b6fc4" ' + SW + '/><path d="M72 127h56" stroke="#fff" stroke-width="6" stroke-linecap="round"/>' },
    { id: 'can', name: '鋁罐', bin: 'recycle', why: '鐵鋁罐可以回收，喝完洗一洗、壓扁。',
      svg: '<path d="M56 44h88l6 10v104l-6 10H56l-6-10V54z" fill="#cfd4dc" ' + SW + '/><rect x="50" y="76" width="100" height="64" fill="#e0523f" ' + SW + '/><ellipse cx="100" cy="44" rx="44" ry="9" fill="#e8ebf0" ' + SW + '/><path d="M86 108h28M100 94v28" stroke="#fff" stroke-width="6" stroke-linecap="round"/>' },
    { id: 'news', name: '報紙', bin: 'recycle', why: '乾淨的紙類可以回收，要保持乾燥。',

  function sumRow(e) {
    if (e.kind === 'r4') {
      var sc = SC_BY[e.id], r = RS[sc.r];
      return h('div', { class: 'sumrow' }, h('div', { class: 'mini', html: r.icon }), h('span', {}, sc.q, '　→ ', r.name));
    }
    var it = BY_ID[e.id];
    return h('div', { class: 'sumrow' }, h('div', { class: 'mini', html: itemSvg(it) }), h('span', {}, it.name, ' 要丟 ', tag(it.bin), e.unfound ? '（沒找到）' : ''));
  }
  function turnsumView() {
    var p = st.players[st.turn];
    var wrong = st.turnLog.filter(function (e) { return !e.ok && !e.skipped; });
    var last = st.turn + 1 >= st.players.length;
    return h('main', {}, h('div', { class: 'center' },
      h('span', { class: 'pill' }, gameOf(st.game).name),
      h('h1', {}, p.name + ' 得到 ' + st.turnPts + ' 分'),
      st.turnSkipped ? h('p', { class: 'sub' }, '漏掉了 ' + st.turnSkipped + ' 件，下次加油！') : null,
      wrong.length ? h('div', { class: 'result no' }, h('p', { class: 'why' }, '這些要記住：'), h('div', { class: 'sumlist' }, wrong.map(sumRow)))
        : h('p', { class: 'sub' }, st.turnLog.length ? '全部答對，太棒了！' : '下一位加油！'),
      h('button', { class: 'btn-big', onclick: function () {
        st.cur = null; st.last = null;
        if (last) st.screen = 'round'; else { st.turn++; st.screen = 'ready'; }
        save(); render();
      } }, last ? '看這一輪的成績' : '換下一位')
    ));
  }
  function roundView() {
    var max = Math.max(1, Math.max.apply(null, st.players.map(function (p) { return p.points; })));
    return h('main', {}, h('div', { class: 'center' },
      h('span', { class: 'pill' }, '第 ' + st.round + ' 輪結束'),
      h('h1', {}, '大家都玩完了！'),
      h('div', { class: 'plist' }, st.players.map(function (p) {
        return h('div', { class: 'prow' }, h('span', {}, p.name), h('div', { class: 'bar' }, h('i', { style: 'width:' + (p.points / max * 100) + '%' })), h('span', { class: 'pt' }, p.points));
      })),
      h('p', { class: 'sub' }, '第 ' + st.group + ' 組一共 ' + st.points + ' 分'),
      h('button', { class: 'btn-big', onclick: function () { st.round++; st.turn = 0; st.screen = 'ready'; save(); render(); } }, '再玩一輪')
    ));
  }

  function tabletView() {
    var main, c = st.cur;
    if (st.screen === 'ready' && st.players.length) main = readyView();
    else if (st.screen === 'play' && c) main = c.kind === 'sort' ? sortView() : c.kind === 'tf' ? tfView() : c.kind === 'r4' ? r4View() : c.kind === 'find' ? findView() : beltView();
    else if (st.screen === 'feedback' && c && st.last) main = feedbackView();
    else if (st.screen === 'turnsum' && st.players.length) main = turnsumView();
    else if (st.screen === 'round' && st.players.length) main = roundView();
    else main = setupView();
    return [h('header', { class: 'top', id: 'top' }, topBar().filter(Boolean)), h('div', { class: 'coopbar', id: 'coop', hidden: true }), main];
  }

  /* ---------- teacher board ---------- */
  var BM = 'garbage-board-manual-v1';
  var manual = lsGet(BM) || {};
  var live = {};
  var unsubBoard = null, canReset = true, confirming = false, boardEl = null, prevTotal = null;

  function boardData() {
    var src = db ? live : manual, out = [];
    Object.keys(src).forEach(function (k) { var g = src[k]; out.push({ n: g.group || Number(k), points: g.points || 0, played: g.played || 0, correct: g.correct || 0, misses: g.misses || {} }); });
    return out;
  }
  function missInfo(id) {
    if (SC_BY[id]) { var sc = SC_BY[id], r = RS[sc.r]; return { name: sc.q, svg: r.icon, right: r.name }; }
    var it = BY_ID[id]; return it ? { name: it.name, svg: itemSvg(it), right: BINS[it.bin].name } : null;
  }
  function controls(isManual) {
    var kids = [];
    if (!isManual && dbState === 'ready') {
      kids.push(h('span', { class: 'lab' }, '目前玩法'));
      GAMES.forEach(function (g) { kids.push(h('button', { class: 'seg', 'aria-pressed': String(cfg.game === g.id), onclick: function () { setCfg({ game: g.id }); } }, g.name)); });
    }
    kids.push(h('span', { class: 'lab' }, '模式'));
    kids.push(h('button', { class: 'seg', 'aria-pressed': String(!cfg.coop), onclick: function () { setCfg({ coop: false }); } }, '各組競賽'));
    kids.push(h('button', { class: 'seg', 'aria-pressed': String(!!cfg.coop), onclick: function () { setCfg({ coop: true }); } }, '全班合作'));
    if (cfg.coop) {
      kids.push(h('span', { class: 'goal' }, '目標 ',
        h('button', { class: 'btn-sm', 'aria-label': '目標減 5 分', onclick: function () { setCfg({ goal: Math.max(5, cfg.goal - 5) }); } }, '−5'),
        h('b', {}, cfg.goal),
        h('button', { class: 'btn-sm', 'aria-label': '目標加 5 分', onclick: function () { setCfg({ goal: cfg.goal + 5 }); } }, '+5'), ' 分'));
    }
    return h('section', { class: 'card' }, h('div', { class: 'ctl' }, kids));
  }
  function paintBoard() {
    if (!boardEl) return;
    var rows = boardData(), isManual = !db && dbState !== 'pending';
    if (isManual) { for (var n = 1; n <= GROUPS.length; n++) if (!rows.some(function (r) { return r.n === n; })) rows.push({ n: n, points: 0, played: 0, correct: 0, misses: {} }); }
    rows.sort(function (a, b) { return b.points - a.points || a.n - b.n; });
    var total = rows.reduce(function (s, r) { return s + r.points; }, 0);
    var max = Math.max(1, rows.reduce(function (m, r) { return Math.max(m, r.points); }, 0));
    var top = rows.length && rows[0].points > 0 && !cfg.coop ? rows[0].points : -1;
    if (cfg.coop && prevTotal != null && prevTotal < cfg.goal && total >= cfg.goal) confetti();
    prevTotal = total;

    var list = rows.length ? rows.map(function (r) {
      var pct = r.played ? Math.round(r.correct / r.played * 100) : null;
      return h('div', { class: 'grow-row' },
        h('div', { class: 'chip', style: 'background:' + gcolor(r.n) }, '第 ' + r.n + ' 組'),
        h('div', { class: 'bar', role: 'img', 'aria-label': '第 ' + r.n + ' 組 ' + r.points + ' 分' }, h('i', { style: 'width:' + (r.points / max * 100) + '%;background:' + gcolor(r.n) })),
        isManual ? h('div', { class: 'pts adjcell' },
          h('button', { class: 'btn-sm', 'aria-label': '第 ' + r.n + ' 組減 1 分', onclick: function () { adjust(r.n, -1); } }, '−'),
          h('span', {}, r.points),
          h('button', { class: 'btn-sm', 'aria-label': '第 ' + r.n + ' 組加 1 分', onclick: function () { adjust(r.n, 1); } }, '+'))
          : h('div', { class: 'pts' }, r.points),
        isManual ? null : h('div', { class: 'meta' }, (r.points === top ? '目前領先・' : '') + '玩了 ' + r.played + ' 題' + (pct != null ? '，答對 ' + pct + '%' : '')));
    }) : [h('p', { class: 'empty' }, dbState === 'pending' ? '連線中…' : '等一下，各組平板選好組別後，分數會出現在這裡。')];

    var miss = {};
    rows.forEach(function (r) { Object.keys(r.misses).forEach(function (id) { miss[id] = (miss[id] || 0) + r.misses[id]; }); });
    var worst = Object.keys(miss).filter(function (id) { return missInfo(id); }).sort(function (a, b) { return miss[b] - miss[a]; }).slice(0, 4);

    var energy = null;
    if (cfg.coop) {
      var pct2 = Math.min(100, total / Math.max(1, cfg.goal) * 100);
      energy = h('section', { class: 'card energy' }, h('h2', {}, '地球能量'),
        h('div', { class: 'track', role: 'img', 'aria-label': '全班 ' + total + ' 分，目標 ' + cfg.goal + ' 分' }, h('i', { style: 'width:' + pct2 + '%' })),
        h('p', { class: 'big' }, total + ' / ' + cfg.goal + ' 分'),
        total >= cfg.goal ? h('p', { class: 'win' }, '闖關成功！全班一起做到了！') : h('p', { class: 'empty' }, '還差 ' + (cfg.goal - total) + ' 分，大家一起加油！'));
    }

    boardEl.replaceChildren.apply(boardEl, [
      h('div', { class: 'board-head' }, h('h1', {}, '垃圾分類大挑戰'), h('div', { class: 'total', role: 'status' }, h('span', {}, '全班累積分數'), h('b', {}, total))),
      controls(isManual),
      energy,
      h('div', { class: 'grid2' },
        h('section', { class: 'card' }, h('h2', {}, '各組分數'), list),
        h('section', { class: 'card' }, h('h2', {}, '最容易答錯'),
          worst.length ? worst.map(function (id) {
            var mi = missInfo(id);
            return h('div', { class: 'miss' }, h('div', { class: 'mini', html: mi.svg }), h('p', {}, mi.name, h('br'), h('small', {}, '答錯 ' + miss[id] + ' 次・正確是' + mi.right)));
          }) : h('p', { class: 'empty' }, '還沒有人答錯。'))
      ),
      h('div', { class: 'row' },
        h('span', { class: 'status' }, isManual ? '單機模式：請老師用 +、− 手動記分，玩法請各組在平板上選。' : (dbState === 'pending' ? '連線中…' : '即時連線中，各組答題後分數會自動更新。')),
        h('div', { class: 'grow' }),
        canReset ? (confirming
          ? h('div', { class: 'confirm' }, h('span', {}, '確定要全部歸零嗎？'),
            h('button', { class: 'btn-sm', onclick: doReset }, '確定歸零'),
            h('button', { class: 'btn-sm', onclick: function () { confirming = false; paintBoard(); } }, '取消'))
          : h('button', { class: 'btn-sm', onclick: function () { confirming = true; paintBoard(); } }, '全部歸零')) : null,
        h('a', { class: 'link', href: '#' }, '回到小朋友畫面'))
    ].filter(Boolean));
  }
  function adjust(n, d) {
    var g = manual[n] || { group: n, points: 0, played: 0, correct: 0, misses: {} };
    g.points = Math.max(0, (g.points || 0) + d); manual[n] = g; lsSet(BM, manual); paintBoard();
  }
  function doReset() {
    confirming = false; prevTotal = null;
    if (!db) { manual = {}; lsSet(BM, manual); paintBoard(); return; }
    db.collection('scores').get().then(function (s) { return Promise.all(s.docs.map(function (d) { return db.doc('scores/' + d.id).delete(); })); })
      .then(function () { live = {}; paintBoard(); }).catch(function () { paintBoard(); });
  }
  function startBoard() {
    boardEl = h('div', { class: 'app', style: 'min-height:0' });
    paintBoard();
    if (db && !unsubBoard) {
      unsubBoard = db.collection('scores').onSnapshot(function (s) {
        live = {};
        s.docs.forEach(function (d) { live[d.id] = d.data(); });
        paintBoard();
      }, function () { });
    }
    return h('main', {}, boardEl);
  }
  function stopBoard() { if (unsubBoard) { unsubBoard(); unsubBoard = null; } boardEl = null; }

  /* ---------- router ---------- */
  function isBoard() { return location.hash === '#board'; }
  function render() {
    stopBelt();
    if (isBoard()) {
      root.replaceChildren(startBoard());
    } else {
      stopBoard();
      root.replaceChildren.apply(root, tabletView());
      paintCoop();
    }
  }
  window.addEventListener('hashchange', function () { stopBoard(); render(); });

  render();

  /* ---------- optional Supabase backend (used on GitHub Pages; the Claude page uses its own db) ---------- */
  function supaDb() {
    var C = window.GAME_SUPABASE || {};
    if (!C.url || !C.key || /你的|YOUR/i.test(C.url + C.key)) return null;
    var base = C.url.replace(/\/+$/, '') + '/rest/v1/kv';
    var H = { apikey: C.key, Authorization: 'Bearer ' + C.key, 'Content-Type': 'application/json' };
    var cache = {}, touched = {}, loaded = false, subs = [], timer = null;
    function fire() { if (loaded) subs.slice().forEach(function (f) { try { f(); } catch (e) { /* listener errors must not stop polling */ } }); }
    function poll() {
      return fetch(base + '?select=path,data', { headers: H }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (rows) {
        var next = {}, now = Date.now();
        rows.forEach(function (r) { next[r.path] = r.data; });
        // keep our own very recent writes/deletes: a poll that started before them must not undo them
        Object.keys(touched).forEach(function (p) {
          if (now - touched[p].t < 4000) { if (touched[p].del) delete next[p]; else next[p] = touched[p].v; } else delete touched[p];
        });
        cache = next; loaded = true; fire();
      }).catch(function () { /* offline: keep last known data */ });
    }
    function ensure() { if (!timer) { poll(); timer = setInterval(poll, 2000); } }
    function snap(p) { return { id: p.split('/').pop(), exists: p in cache, data: function () { return cache[p]; }, metadata: { fromCache: false, hasPendingWrites: false } }; }
    function colSnap(c) {
      var docs = Object.keys(cache).filter(function (p) { return p.indexOf(c + '/') === 0; }).map(snap);
      return { docs: docs, size: docs.length, empty: !docs.length, metadata: {} };
    }
    function listen(make, cb) {
      ensure();
      var f = function () { cb(make()); };
      subs.push(f); if (loaded) setTimeout(f, 0);
      return function () { subs = subs.filter(function (x) { return x !== f; }); };
    }
    return {
      doc: function (p) {
        return {
          get: function () { return poll().then(function () { return snap(p); }); },
          set: function (d) {
            var v = JSON.parse(JSON.stringify(d));
            touched[p] = { t: Date.now(), v: v }; cache[p] = v; fire();
            return fetch(base + '?on_conflict=path', { method: 'POST', headers: Object.assign({ Prefer: 'resolution=merge-duplicates,return=minimal' }, H), body: JSON.stringify({ path: p, data: v, updated_at: new Date().toISOString() }) })
              .then(function (r) { if (!r.ok) throw new Error(r.status); });
          },
          delete: function () {
            touched[p] = { t: Date.now(), del: true }; delete cache[p]; fire();
            return fetch(base + '?path=eq.' + encodeURIComponent(p), { method: 'DELETE', headers: H }).then(function (r) { if (!r.ok) throw new Error(r.status); });
          },
          onSnapshot: function (cb) { return listen(function () { return snap(p); }, cb); }
        };
      },
      collection: function (c) {
        return {
          get: function () { return poll().then(function () { return colSnap(c); }); },
          onSnapshot: function (cb) { return listen(function () { return colSnap(c); }, cb); }
        };
      }
    };
  }

  /* ---------- runtime capabilities (optional: the page works without them) ---------- */
  (window.claude && window.claude.use ? window.claude.use('db') : Promise.resolve(null)).then(function (d) { return d || supaDb(); }).then(function (d) {
    db = d; dbState = d ? 'ready' : 'none';
    if (d) { net = 'ok'; sync(); watchOwn(); watchCfg(); watchTotals(); }
    if (isBoard()) { stopBoard(); render(); } else if (st.screen === 'setup') { render(); } else { paintTop(); paintCoop(); }
  }).catch(function () { dbState = 'none'; if (isBoard()) paintBoard(); else paintTop(); });
  (window.claude && window.claude.use ? window.claude.use('user') : Promise.resolve(null)).then(function (u) {
    if (u && u.canEdit) return u.canEdit().then(function (v) { canReset = v !== false; if (boardEl) paintBoard(); });
  }).catch(function () { });
})();
</script>
